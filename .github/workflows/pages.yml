name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/**"
      - "examples/documents/**"
      - "pyproject.toml"
      - "scripts/build_try_bundle.py"
      - "scripts/inject_partials.py"
      - "scripts/check_links.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Inject the shared nav and footer into every page (idempotent; no build step)
        run: python scripts/inject_partials.py
      - uses: actions/configure-pages@v5
      # The try page's engine (about 18 MB) is not committed: it is built here from the sha256-pinned
      # lockfile apps/site/try/bundle.lock.json plus a ClaimTrace wheel of this commit.
      - name: Build the try page engine bundle
        run: python scripts/build_try_bundle.py
      # after the build, so the try page's samples and engine files it fetches are checked too
      - name: Every internal link resolves
        run: python scripts/check_links.py --require-built
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site
      - id: deployment
        uses: actions/deploy-pages@v4
