name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/**"
      - "scripts/build_try_bundle.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The try page's engine (about 18 MB) is not committed: it is built here from the sha256-pinned
      # lockfile apps/site/try/bundle.lock.json plus a ClaimTrace wheel of this commit.
      - name: Build the try page engine bundle
        run: python scripts/build_try_bundle.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site
      - id: deployment
        uses: actions/deploy-pages@v4
