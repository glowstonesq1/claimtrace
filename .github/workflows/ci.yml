name: CI
on:
  push: { branches: [main] }
  pull_request:
  release: { types: [published] }
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install runtime dependencies from the hash-pinned lockfile
        run: pip install --require-hashes -r requirements.lock
      - name: Install ClaimTrace and dev tools
        run: |
          pip install --no-deps -e .
          pip install 'pytest>=8' 'ruff>=0.6' 'mypy>=1.10' 'reportlab>=4' pip-audit pip-licenses pip-tools
      - name: Lockfile matches pyproject.toml (existing pins kept; fails if a dependency is missing or extra)
        run: |
          cp requirements.lock /tmp/requirements.lock
          pip-compile --quiet --generate-hashes --strip-extras --allow-unsafe --no-emit-index-url \
            --output-file /tmp/requirements.lock pyproject.toml
          diff <(grep -E '^[a-z0-9]' requirements.lock) <(grep -E '^[a-z0-9]' /tmp/requirements.lock)
      - name: Lint
        run: ruff check packages apps tests
      - name: Type check (core)
        run: mypy
      - name: Tests (unit, API, security, privacy)
        run: pytest -q
      - name: Evaluation smoke test (rules baseline, full core suite, no network)
        run: claimtrace eval run --suite core --model rules --out evals/runs/ci
      - name: Licence gate (no GPL/AGPL in runtime dependencies)
        run: |
          pip-licenses --packages $(python -c "import tomllib;d=tomllib.load(open('pyproject.toml','rb'));print(' '.join(x.split('>')[0].split('=')[0].split('[')[0] for x in d['project']['dependencies']))") --format=csv > licenses.csv
          cat licenses.csv
          ! grep -Ei '"(GNU|.*GPL)' licenses.csv
      - name: Dependency vulnerability audit (blocking)
        run: pip-audit -r requirements.lock --require-hashes --disable-pip --strict

  skill:
    # Claude.ai skill zip + Claude Code plugin zip (docs/claude.md). Artifact on every run; attached to releases.
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build dist/claimtrace-skill.zip and dist/claimtrace-plugin.zip (wheels checked against requirements.lock)
        run: python scripts/build_skill_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: claimtrace-skill
          path: |
            dist/claimtrace-skill.zip
            dist/claimtrace-plugin.zip
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" dist/claimtrace-skill.zip dist/claimtrace-plugin.zip --clobber

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - name: Typecheck and build
        run: npm run build
        working-directory: apps/web
      - name: No dangerouslySetInnerHTML
        run: "! grep -rn dangerouslySetInnerHTML apps/web/src"
      - name: Browser end-to-end + accessibility (axe)
        run: |
          pip install -e .
          npx --prefix apps/web playwright@1.49.1 install --with-deps chromium
          CLAIMTRACE_DB=/tmp/e2e.db claimtrace serve --port 8765 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/health && break; sleep 1; done
          cd apps/web && npm i --no-save playwright@1.49.1 && BASE=http://127.0.0.1:8765 node e2e/smoke.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t claimtrace:ci .
